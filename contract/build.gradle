
description = 'OWLAPI :: Tests and Tutorials'
def rdf4jversion = '4.3.16'
dependencies {
  implementation project(':owlapi-api')
  implementation project(':owlapi-impl')
  implementation project(':owlapi-apibinding')
  implementation project(':owlapi-tools')
  implementation project(':owlapi-functionalformat')
  implementation project(':owlapi-manchesterformat')
  implementation project(':owlapi-oboformat')
  implementation project(':owlapi-otherformats')
  implementation project(':owlapi-owlxmlformat')
  implementation project(':owlapi-rdfformats')
  implementation project(':owlapi-rio')
  implementation 'org.apache.commons:commons-rdf-api:0.5.0'
  implementation "org.eclipse.rdf4j:rdf4j-model:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-api:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-languages:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-datatypes:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-binary:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-n3:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-nquads:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-ntriples:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-rdfjson:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-rdfxml:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-trix:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-turtle:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-trig:$rdf4jversion"
  implementation "org.eclipse.rdf4j:rdf4j-rio-hdt:$rdf4jversion"
  implementation ("org.eclipse.rdf4j:rdf4j-rio-jsonld:$rdf4jversion") {
    exclude module: "httpclient-osgi"
    exclude module: "httpcore-osgi"
  }
  implementation ('com.github.jsonld-java:jsonld-java:0.13.6') {
    exclude module: "httpclient-osgi"
    exclude module: "httpcore-osgi"
  }
  //testImplementation 'org.apache.commons:commons-rdf-api:0.5.0:tests'
  testImplementation 'org.hamcrest:hamcrest-core:3.0'
  testImplementation 'org.mockito:mockito-core:5.23.0'
  testImplementation 'org.slf4j:slf4j-simple:2.0.19'
  testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
}