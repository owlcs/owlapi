
description = 'OWLAPI :: Default Implementation'
dependencies {
  implementation 'com.carrotsearch:hppc:0.11.1'
  implementation ('com.github.ben-manes.caffeine:caffeine:3.1.8') {
    exclude module: "checker-qual"
    exclude module: "error_prone_annotations"
  }
  implementation project(':owlapi-api')
  implementation project(':owlapi-tools')
  implementation 'javax.inject:javax.inject:1'
  implementation 'org.apache.commons:commons-rdf-api:0.5.0'
}
